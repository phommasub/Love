<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอเป็นแฟนกับสาว 💖</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit & Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        romantic: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    },
                    fontFamily: {
                        kanit: ['Kanit', 'sans-serif'],
                        prompt: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            user-select: none;
            overflow-x: hidden;
            background: linear-gradient(135deg, #ffe4e6 0%, #fff1f2 50%, #fecdd3 100%);
            min-height: 100vh;
        }

        /* Floating Hearts Particles */
        .heart-particle {
            position: fixed;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
            }
            50% {
                transform: translate(calc(-50% + (var(--rand-x) * 1px)), calc(-100px - (var(--rand-y) * 1px))) scale(1.2) rotate(var(--rand-deg));
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + (var(--rand-x) * 1.5px)), calc(-200px - (var(--rand-y) * 1.5px))) scale(0.8) rotate(calc(var(--rand-deg) * 2));
            }
        }

        /* Envelope Flap Animations */
        .envelope-wrapper {
            perspective: 1000px;
        }
        .envelope {
            position: relative;
            transition: transform 0.6s ease;
        }
        .envelope.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background-color: #fda4af;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 3;
            border-bottom: 2px solid #fb7185;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }

        /* Heart Fill Mask Animation */
        .heart-mask {
            clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
        }

        /* Custom Scrollbar for Gallery */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #ffe4e6;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fda4af;
            border-radius: 10px;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Print Style Fixes for Certificate */
        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center min-h-screen p-4" onclick="createHeartEffect(event)">

    <!-- Audio Player (Floating Controller) -->
    <div class="fixed top-4 right-4 z-50 flex items-center gap-2 bg-white/90 backdrop-blur-md px-4 py-2 rounded-full shadow-lg border border-pink-200" onclick="event.stopPropagation()">
        <button id="bgm-toggle-btn" onclick="toggleAudio()" class="text-pink-500 hover:text-pink-600 transition text-lg">
            <i id="bgm-icon" class="fas fa-music animate-spin" style="animation-duration: 3s;"></i>
        </button>
        <span class="text-xs text-pink-600 font-medium hidden sm:inline" id="bgm-status">เพลงรักของเรา 💕</span>
        <label for="audio-upload" class="cursor-pointer text-xs bg-pink-100 hover:bg-pink-200 text-pink-600 px-2.5 py-1 rounded-full transition border border-pink-300">
            <i class="fas fa-upload mr-1"></i>เปลี่ยนเพลง
        </label>
        <input type="file" id="audio-upload" accept="audio/*" class="hidden" onchange="loadCustomAudio(event)">
        <audio id="bgm-audio" loop>
            <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sweet-love-115283.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Main Dynamic Screen Container -->
    <div id="app-container" class="w-full max-w-md sm:max-w-xl transition-all duration-500">
        <!-- Content will be rendered dynamically by JavaScript -->
    </div>

    <!-- Notification Modal Popup (Custom Alert / Modal) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 max-w-xs sm:max-w-sm w-full text-center shadow-2xl border-4 border-pink-300 transform transition-all scale-100">
            <div id="modal-icon" class="text-5xl mb-3">🔔</div>
            <h3 id="modal-title" class="text-xl font-bold text-pink-600 mb-2">แจ้งเตือน</h3>
            <p id="modal-message" class="text-gray-600 text-sm mb-5">ข้อความแจ้งเตือน</p>
            <button id="modal-action-btn" onclick="closeModal()" class="w-full py-2.5 bg-gradient-to-r from-pink-400 to-rose-400 text-white font-bold rounded-full shadow-md hover:from-pink-500 hover:to-rose-500 transition">
                ตกลง 💕
            </button>
        </div>
    </div>

    <script>
        // State Management
        let currentStep = 1;
        let heartLoveFill = 0; // Out of 100
        let audioPlaying = false;

        // Dynamic Image Paths (ชี้ไปที่โฟลเดอร์ images/ สำหรับ Cloudflare Pages)
        const appImages = {
            polaroid: 'images/polaroid.jpg',
            timeline: [
                'images/timeline-1.jpg',
                'images/timeline-2.jpg',
                'images/timeline-3.jpg',
                'images/timeline-4.jpg',
                'images/timeline-5.jpg'
            ],
            question: 'images/question.jpg',
            rose: 'images/rose.jpg',
            gif: 'images/gif.gif',
            cert1: 'images/cert-1.jpg',
            cert2: 'images/cert-2.jpg'
        };

        // Fallback Unsplash Placeholders (หากไม่พบไฟล์ใน Cloudflare)
        const fallbackImages = {
            polaroid: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500&auto=format&fit=crop',
            timeline: [
                'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=500&auto=format&fit=crop',
                'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=500&auto=format&fit=crop',
                'https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=500&auto=format&fit=crop',
                'https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=500&auto=format&fit=crop',
                'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop'
            ],
            question: 'https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=500&auto=format&fit=crop',
            rose: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop',
            gif: 'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Yyb2s5cGtqYmxsYXZ6Z3psdWg3OGdya3dkeGFiOG8ybWV3d2F5MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L3X9GvEGEYBSRlq4fg/giphy.gif',
            cert1: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=300&auto=format&fit=crop',
            cert2: 'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=300&auto=format&fit=crop'
        };

        // Evasive Mobile Button Error Messages
        const mobileErrorList = [
            "ไม่พบคำตอบนี้ในระบบ",
            "ยังจะเลือกคำตอบนี้อีกหรอ",
            "กำลังทดสอบระบบหรอจ๊ะ",
            "ไม่ให้เลือกคำตอบนี้หรอกจ้ะ",
            "ถ้ายังเลือกอีกโดนแน่!!",
            "หน่ะ!! ยังจะเลือกอีก",
            "เตือนละนะ",
            "พอละหมดมุกละ ยอมผมเถอะครับ",
            "ไปกดอนุมัติได้แล้วววว"
        ];
        let mobileErrorIndex = 0;

        // Handle Image Loading Fallbacks
        function handleImgError(element, fallbackKey, index = null) {
            if (index !== null) {
                element.src = fallbackImages[fallbackKey][index];
            } else {
                element.src = fallbackImages[fallbackKey];
            }
        }

        // Floating Hearts Interactive Particles
        function createHeartEffect(e) {
            const heartCount = 3;
            const emojis = ['💖', '💕', '💗', '💓', '❤️', '🌸', '✨'];
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle text-xl select-none';
                heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                
                const randX = (Math.random() - 0.5) * 200;
                const randY = Math.random() * 150 + 50;
                const randDeg = (Math.random() - 0.5) * 90;

                heart.style.setProperty('--rand-x', randX);
                heart.style.setProperty('--rand-y', randY);
                heart.style.setProperty('--rand-deg', randDeg + 'deg');

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 2000);
            }
        }

        // Audio Controls
        function toggleAudio() {
            const audio = document.getElementById('bgm-audio');
            const icon = document.getElementById('bgm-icon');
            const status = document.getElementById('bgm-status');
            
            if (audioPlaying) {
                audio.pause();
                icon.className = "fas fa-music-slash";
                icon.classList.remove('animate-spin');
                status.innerText = "เปิดเพลง";
            } else {
                audio.play().then(() => {
                    icon.className = "fas fa-music animate-spin";
                    status.innerText = "เพลงรักของเรา 💕";
                }).catch(err => {
                    console.log("Audio play blocked", err);
                });
            }
            audioPlaying = !audioPlaying;
        }

        function loadCustomAudio(e) {
            const file = e.target.files[0];
            if (file) {
                const audio = document.getElementById('bgm-audio');
                audio.src = URL.createObjectURL(file);
                audio.play();
                audioPlaying = true;
                document.getElementById('bgm-icon').className = "fas fa-music animate-spin";
                document.getElementById('bgm-status').innerText = file.name.substring(0, 10) + '...';
            }
        }

        // Interactive Photo Upload Handler
        function handlePhotoUpload(event, imageKey, timelineIndex = null) {
            event.stopPropagation();
            const file = event.target.files[0];
            if (file) {
                const newUrl = URL.createObjectURL(file);
                if (timelineIndex !== null) {
                    appImages.timeline[timelineIndex] = newUrl;
                } else {
                    appImages[imageKey] = newUrl;
                }
                renderScreen();
            }
        }

        // Step Router & Render Engine
        function renderScreen() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            switch (currentStep) {
                case 1:
                    renderStep1(container);
                    break;
                case 2:
                    renderStep2(container);
                    break;
                case 3:
                    renderStep3(container);
                    break;
                case 4:
                    renderStep4(container);
                    break;
                case 5:
                    renderStep5(container);
                    break;
                case 6:
                    renderStep6(container);
                    break;
                case 7:
                    renderStep7(container);
                    break;
            }
        }

        // Step 1: Heart Fill Interactive Screen
        function renderStep1(container) {
            container.innerHTML = `
                <div class="glass-card rounded-3xl p-8 text-center shadow-xl border-4 border-pink-200">
                    <div class="inline-block bg-pink-100 text-pink-600 px-4 py-1.5 rounded-full text-xs font-semibold mb-4 animate-bounce">
                        💖 แตะหน้าจอตรงไหนก็ได้เพื่อเติมความรัก 💖
                    </div>
                    <h1 class="text-2xl font-bold text-pink-600 mb-2">เติมความรักให้เต็มหัวใจนะงับ</h1>
                    <p class="text-gray-500 text-sm mb-6">จิ้ม 1 ครั้ง เพิ่มความรัก 2 ส่วน 💕</p>

                    <!-- Big Interactive Heart Container -->
                    <div class="relative w-48 h-48 mx-auto my-6 cursor-pointer transform hover:scale-105 transition" onclick="tapAddLove(event)">
                        <!-- Background Heart (White/Pink Tint) -->
                        <div class="absolute inset-0 bg-white border-4 border-pink-300 rounded-full shadow-inner flex items-center justify-center">
                            <i class="fas fa-heart text-pink-100 text-9xl"></i>
                        </div>
                        
                        <!-- Filling Pink Heart Layer -->
                        <div id="heart-fill-layer" class="absolute inset-0 bg-gradient-to-t from-pink-500 to-rose-400 rounded-full transition-all duration-300 flex items-center justify-center overflow-hidden" style="height: ${heartLoveFill}%; top: ${100 - heartLoveFill}%;">
                            <i class="fas fa-heart text-white text-9xl absolute bottom-0"></i>
                        </div>

                        <!-- Progress Text Overlay -->
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-pink-600 font-extrabold text-2xl drop-shadow-md pointer-events-none">
                            <span>${heartLoveFill}%</span>
                            <span class="text-xs font-normal text-pink-500">Love Level</span>
                        </div>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-full bg-pink-100 rounded-full h-4 mb-4 overflow-hidden border border-pink-200 shadow-inner">
                        <div class="bg-gradient-to-r from-pink-400 to-rose-500 h-full transition-all duration-300" style="width: ${heartLoveFill}%"></div>
                    </div>
                    <p class="text-xs text-pink-400 font-medium">กดสะสมให้ครบ 100% เพื่อไปต่อหน้านะงับ 💕</p>
                </div>
            `;
        }

        function tapAddLove(e) {
            if (heartLoveFill < 100) {
                heartLoveFill = Math.min(100, heartLoveFill + 2);
                renderStep1(document.getElementById('app-container'));
                if (heartLoveFill >= 100) {
                    setTimeout(() => {
                        showModal("🎉 ความรักเต็ม 100% แล้ว!", "กำลังพาไปหน้าใส่รหัสลับหัวใจนะงับ...", "เข้าสู่หน้าถัดไป 💕", () => {
                            currentStep = 2;
                            renderScreen();
                        });
                    }, 300);
                }
            }
        }

        // Step 2: Passcode & Polaroid Screen
        function renderStep2(container) {
            container.innerHTML = `
                <div class="glass-card rounded-3xl p-6 shadow-xl border-4 border-pink-200">
                    <h2 class="text-2xl font-bold text-center text-pink-600 mb-4">🔐 รหัสลับหัวใจ</h2>
                    
                    <div class="flex flex-col md:flex-row items-center gap-6 my-4">
                        <!-- Polaroid Frame -->
                        <div class="relative group bg-white p-3 pb-8 shadow-md rounded-lg transform -rotate-2 hover:rotate-0 transition border border-gray-200 w-48 flex-shrink-0">
                            <div class="relative w-full h-48 bg-pink-50 rounded overflow-hidden flex items-center justify-center">
                                <img src="${appImages.polaroid}" onerror="handleImgError(this, 'polaroid')" class="w-full h-full object-cover">
                                <label class="absolute inset-0 bg-black/40 text-white opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center transition cursor-pointer text-xs">
                                    <i class="fas fa-camera text-xl mb-1"></i>
                                    <span>อัปโหลดรูปภาพ</span>
                                    <input type="file" accept="image/*" class="hidden" onchange="handlePhotoUpload(event, 'polaroid')">
                                </label>
                            </div>
                            <p class="text-center font-handwriting text-pink-500 mt-2 text-sm">รูปของเรา 💕</p>
                        </div>

                        <!-- Passcode Form -->
                        <div class="flex-1 w-full">
                            <div class="bg-pink-50 p-4 rounded-2xl border border-pink-200 mb-4 text-center">
                                <span class="text-xs font-semibold text-pink-500 uppercase tracking-wider">💡 คำใบ้รหัสผ่าน</span>
                                <p class="text-pink-700 font-bold text-lg mt-0.5">“วันเกิดของคุณ (DDMMหรือDDMMYYYY)”</p>
                            </div>
                            
                            <div class="mb-4">
                                <input type="password" id="passcode-input" placeholder="กรอกรหัสผ่าน..." class="w-full px-4 py-3 rounded-full border-2 border-pink-300 focus:border-rose-500 focus:outline-none text-center text-lg tracking-widest text-pink-600 font-bold shadow-inner">
                            </div>
                            <button onclick="checkPasscode()" class="w-full py-3 bg-gradient-to-r from-pink-400 to-rose-500 text-white font-bold rounded-full shadow-lg hover:from-pink-500 hover:to-rose-600 transition flex items-center justify-center gap-2">
                                <i class="fas fa-key"></i> ยืนยันรหัสผ่าน
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function checkPasscode() {
            const input = document.getElementById('passcode-input').value.trim();
            if (input !== "") {
                showModal("✨ รหัสผ่านถูกต้อง!", "รหัสผ่านถูกต้อง ที่รักเก่งที่สุดเลยค้าบ 💖", "ไปดู Gallery ความรักกันเลย 🎉", () => {
                    currentStep = 3;
                    renderScreen();
                });
            } else {
                showModal("❌ รหัสผ่านไม่ถูกต้อง", "ลองใส่วันเกิดของคุณดูใหม่อีกครั้งนะงับ 🥺", "ลองอีกครั้ง");
            }
        }

        // Step 3: Love Timeline Gallery Screen
        function renderStep3(container) {
            const timelineData = [
                { title: "วันแรกที่เราเริ่มคุยกัน 💬", desc: "เขินสุดๆ ไม่รู้จะชวนคุยยังไงดี" },
                { title: "เดตแรกของเรา ☕", desc: "ตื่นเต้นจนหัวใจเต้นแรงมาก" },
                { title: "ทริปแรกด้วยกัน 🚗", desc: "รอยยิ้มของคุณทำให้โลกสดใส" },
                { title: "คอยดูแลเค้าเสมอ 🥪", desc: "ขอบคุณเรื่องราวดีๆ ในทุกๆ วัน" },
                { title: "จนถึงวันนี้ ❤️", desc: "ความรู้สึกยิ่งชัดเจนขึ้นเรื่อยๆ" }
            ];

            let cardsHtml = timelineData.map((item, idx) => `
                <div class="flex-shrink-0 w-64 bg-white rounded-2xl p-3 shadow-md border border-pink-200 flex flex-col items-center">
                    <div class="relative group w-full h-44 bg-pink-50 rounded-xl overflow-hidden mb-3">
                        <img src="${appImages.timeline[idx]}" onerror="handleImgError(this, 'timeline', ${idx})" class="w-full h-full object-cover">
                        <label class="absolute inset-0 bg-black/40 text-white opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center transition cursor-pointer text-xs">
                            <i class="fas fa-camera text-lg mb-1"></i>
                            <span>เปลี่ยนรูปที่ ${idx+1}</span>
                            <input type="file" accept="image/*" class="hidden" onchange="handlePhotoUpload(event, 'timeline', ${idx})">
                        </label>
                    </div>
                    <span class="text-xs font-bold bg-pink-100 text-pink-600 px-2.5 py-0.5 rounded-full mb-1">Step ${idx+1}</span>
                    <h4 class="font-bold text-pink-600 text-sm mb-1 text-center">${item.title}</h4>
                    <p class="text-xs text-gray-500 text-center">${item.desc}</p>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="glass-card rounded-3xl p-6 shadow-xl border-4 border-pink-200">
                    <h2 class="text-2xl font-bold text-center text-pink-600 mb-1">📖 ความรักของเราสองคน</h2>
                    <p class="text-center text-xs text-gray-500 mb-4">เลื่อนดูความทรงจำดีๆ ที่ผ่านมางับ 👉</p>

                    <!-- Horizontal Scroll Gallery -->
                    <div class="flex gap-4 overflow-x-auto pb-4 custom-scrollbar mb-4">
                        ${cardsHtml}
                    </div>

                    <button onclick="triggerTimelineFinish()" class="w-full py-3 bg-gradient-to-r from-pink-400 to-rose-500 text-white font-bold rounded-full shadow-lg hover:from-pink-500 hover:to-rose-600 transition flex items-center justify-center gap-2">
                        ดูจบแล้วงับ 💕
                    </button>
                </div>
            `;
        }

        function triggerTimelineFinish() {
            showModal("💻 มีการแจ้งเตือนใหม่!", "เริ่มมีใจหรือยังจ๊ะ? 😉✨", "ไปกันต่อ 👉", () => {
                currentStep = 4;
                renderScreen();
            });
        }

        // Step 4: Interactive Question (Love me?)
        function renderStep4(container) {
            container.innerHTML = `
                <div class="glass-card rounded-3xl p-6 text-center shadow-xl border-4 border-pink-200 relative">
                    <div class="relative group w-48 h-48 mx-auto mb-4 rounded-2xl overflow-hidden shadow-md border-2 border-pink-300">
